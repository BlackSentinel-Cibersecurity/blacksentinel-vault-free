apiVersion: apps/v1
kind: Deployment
metadata:
  name: blacksentinel-secrets-engine
  namespace: blacksentinel-vault
  labels:
    app: blacksentinel-secrets-engine
    component: secrets
spec:
  replicas: 3
  selector:
    matchLabels:
      app: blacksentinel-secrets-engine
  template:
    metadata:
      labels:
        app: blacksentinel-secrets-engine
        component: secrets
    spec:
      containers:
        - name: secrets-engine
          image: blacksentinel/secrets-engine:latest
          ports:
            - containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: blacksentinel-vault-config
            - secretRef:
                name: blacksentinel-vault-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
